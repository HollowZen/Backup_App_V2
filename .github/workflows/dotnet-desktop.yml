# This workflow builds, tests and packages a WPF desktop application
# built on .NET 8.0

name: .NET Core Desktop - Build and Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:

  build-and-test:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Backup_App V2.sln
      Test_Project_Path: BackupApp.Tests\BackupApp.Tests.csproj
      WPF_Project_Path: BackupApp.WPF\BackupApp.WPF.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name

    # Build the solution
    - name: Build solution
      run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

    # Execute all unit tests
    - name: Execute unit tests
      run: dotnet test $env:Test_Project_Path --configuration ${{ matrix.configuration }} --no-build --verbosity normal

    # Publish the WPF application as a standalone executable
    - name: Publish WPF application
      if: matrix.configuration == 'Release'
      run: |
        dotnet publish $env:WPF_Project_Path `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output ./publish/win-x64 `
          /p:PublishSingleFile=true `
          /p:IncludeNativeLibrariesForSelfExtract=true

    # Upload build artifacts (only for Release builds)
    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: BackupApp-Win-x64-${{ github.sha }}
        path: ./publish/win-x64
        retention-days: 30
